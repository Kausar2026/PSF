
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSF Smart QR Guide</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px;
    font-family: Arial, sans-serif;
    background: #f3f7f4;
    color: #183528;
}

.header {
    text-align: center;
    background: #176b45;
    color: white;
    padding: 24px 12px;
    border-radius: 16px;
    margin-bottom: 22px;
}

.header h1 {
    margin: 0 0 10px;
}

.header p {
    margin: 0;
    line-height: 1.5;
}

.qr-list {
    display: grid;
    grid-template-columns: repeat(
        auto-fit, minmax(145px, 1fr)
    );
    gap: 16px;
    max-width: 1100px;
    margin: auto;
}

.qr-item {
    background: white;
    padding: 14px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 3px 12px #00000012;
    min-width: 0;
}

.qr-item h3 {
    font-size: 17px;
    margin: 4px 0 12px;
}

.qr-image {
    display: block;
    width: 100%;
    max-width: 210px;
    aspect-ratio: 1;
    object-fit: contain;
    margin: 0 auto 12px;
    background: white;
}

.qr-status {
    font-size: 12px;
    overflow-wrap: anywhere;
    color: #a23b25;
    margin: 8px 0;
}

.qr-actions {
    display: grid;
    gap: 9px;
}

.qr-actions a,
.qr-actions button {
    display: block;
    width: 100%;
    padding: 11px 6px;
    border: 0;
    border-radius: 8px;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.download-link {
    background: #176b45;
    color: white;
}

.share-link {
    background: #e4f1e9;
    color: #176b45;
}

.qr-actions a[aria-disabled="true"] {
    opacity: .5;
    pointer-events: none;
}

.home-area {
    text-align: center;
    margin: 28px 0 12px;
}

.home-btn {
    display: inline-block;
    background: #183528;
    color: white;
    padding: 13px 22px;
    border-radius: 10px;
    text-decoration: none;
}

@media (max-width: 360px) {
    .qr-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
    }

    .qr-item {
        padding: 9px;
    }
}
</style>
</head>

</header>

<main class="qr-list" id="qrList"></main>

<div class="home-area">

const qrList = document.getElementById("qrList");

function createCard(fruit) {
    const card = document.createElement("section");
    card.className = "qr-item";

    const heading = document.createElement("h3");
    heading.textContent = fruit.emoji + " " + fruit.name;

    const image = document.createElement("img");
    image.className = "qr-image";
    image.alt = fruit.name + " QR Code";

    const status = document.createElement("p");
    status.className = "qr-status";
    status.textContent = "Checking image...";

    const actions = document.createElement("div");
    actions.className = "qr-actions";

    const download = document.createElement("a");
    download.className = "download-link";
    download.textContent = "⬇️ Download QR";
    download.setAttribute("aria-disabled", "true");

    const share = document.createElement("button");
    share.type = "button";
    share.className = "share-link";
    share.textContent = "📤 Share QR";
    share.disabled = true;

    actions.append(download, share);
    card.append(heading, image, status, actions);
    qrList.appendChild(card);

    let resolvedURL = null;

    function tryFile(index) {
        if (index >= fruit.files.length) {
            image.hidden = true;
            status.textContent =
                "Image not found. Check the exact filename.";
            return;
        }

        const filename = fruit.files[index];
        const testImage = new Image();

        testImage.onload = function () {
            resolvedURL = new URL(
                filename,
                document.baseURI
            ).href;

            image.src = resolvedURL;
            image.hidden = false;

            status.textContent = "QR image ready";
            status.style.color = "#176b45";

            download.href = resolvedURL;
            download.download =
                fruit.name.replace(/\s+/g, "-") +
                "-QR-PSF.png";

            download.removeAttribute("aria-disabled");
            share.disabled = false;
        };

        testImage.onerror = function () {
            tryFile(index + 1);
        };

        testImage.src = filename;
    }

    image.hidden = true;
    tryFile(0);

    download.addEventListener("click", function (event) {
        if (!resolvedURL) {
            event.preventDefault();
            alert("QR image nahi mili. Filename check karo.");
        }
    });

    share.addEventListener("click", async function () {
        if (!resolvedURL) return;

        try {
            const response = await fetch(resolvedURL);

            if (!response.ok) {
                throw new Error("Image could not be loaded");
            }

            const blob = await response.blob();

            const file = new File(
                [blob],
                fruit.name.replace(/\s+/g, "-") +
                    "-QR-PSF.png",
                { type: blob.type || "image/png" }
            );

            if (navigator.share &&
                navigator.canShare &&
                navigator.canShare({ files: [file] })) {
                await navigator.share({
                    title: fruit.name + " QR Code",
                    files: [file]
                });
            } else if (navigator.share) {
                await navigator.share({
                    title: fruit.name + " QR Code",
                    url: resolvedURL
                });
            } else {
                window.open(resolvedURL, "_blank");
                alert(
                    "QR image khul gayi hai. Browser menu se " +
                    "Save ya Share kar sakte ho."
                );
            }
        } catch (error) {
            if (error.name === "AbortError") return;

            window.open(resolvedURL, "_blank");
            alert(
                "QR image khol di hai. Ise save karke " +
                "share kar sakte ho."
            );
        }
    });
}
