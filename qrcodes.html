<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSF Smart QR Guide</title>
<link rel="stylesheet" href="style.css">

<style>
.qr-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    padding: 20px;
}
.qr-item {
    background: white;
    border-radius: 24px;
    padding: 24px;
    text-align: center;
    box-shadow: 0 8px 20px #00000012;
}
.qr-image {
    display: block;
    width: 200px;
    height: 200px;
    max-width: 100%;
    object-fit: contain;
    margin: 20px auto;
}
.qr-actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
}
.qr-actions a,
.qr-actions button {
    color: #16834b;
    font-weight: bold;
    text-decoration: none;
    border: none;
    background: transparent;
    font-size: 15px;
    cursor: pointer;
    padding: 8px;
}
.qr-error {
    color: #c62828;
    font-size: 14px;
}
</style>
</head>

<body>

<header class="header">
    <h1>📱 Smart QR Guide</h1>
    <p>Scan any fruit QR Code to know its health benefits.</p>
</header>

<div class="qr-list" id="qrList"></div>

<div class="home-area">
    <a href="index.html" class="home-btn">
        🏠 Back to Home
    </a>
</div>

<script>
const fruits = [
    ["🍎", "Apple", "apple.html.png"],
    ["🟣", "Anjir", "Anjir.html.png"],
    ["🥑", "Avocado", "avocado.html.png"],
    ["🍌", "Banana", "banana.html.png"],
    ["🫐", "Blackberry", "blackberry.html.png"],
    ["🍇", "Black Grapes", "blackgrapes.html.png"],
    ["🫐", "Blueberry", "blueberry.html.png"],
    ["🍒", "Cherry", "cherry.html.png"],
    ["🍂", "Chiku", "chiku.html.png"],
    ["🍏", "Custard Apple", "custardapple.html.png"],
    ["🐉", "Dragon Fruit", "dragonfruit.html.png"],
    ["🍇", "Grapes", "grapes.html.png"],
    ["🍏", "Green Apple", "greenapple.html.png"],
    ["🍐", "Guava", "guava.html.png"],
    ["🥝", "Kiwi", "kiwi.html.png"],
    ["🥭", "Mango", "mango.html.png"],
    ["🍈", "Muskmelon", "muskmelon.html.png"],
    ["🫒", "Olive", "olive.html.png"],
    ["🍊", "Orange", "orange.html.png"],
    ["🧡", "Papaya", "papaya.html.png"],
    ["🍑", "Peach", "peach.html.png"],
    ["🍐", "Pear", "pear.html.png"],
    ["🍍", "Pineapple", "pineapple.html.png"],
    ["❤️", "Pomegranate", "pomegranate.html.png"],
    ["🍓", "Strawberry", "strawberry.html.png"],
    ["🍋", "Sweet Lime", "sweetlime.html.png"],
    ["🍉", "Watermelon", "watermelon.html.png"]
];

const qrList = document.getElementById("qrList");

fruits.forEach(([emoji, name, file]) => {
    const path = "./qr/" + file;
    const item = document.createElement("div");
    item.className = "qr-item";

    const heading = document.createElement("h3");
    heading.textContent = emoji + " " + name;

    const image = document.createElement("img");
    image.src = path;
    image.alt = name + " QR Code";
    image.className = "qr-image";

    image.onerror = function () {
        const error = document.createElement("p");
        error.className = "qr-error";
        error.textContent = "QR image not found: " + file;
        if (!item.querySelector(".qr-error")) {
            item.appendChild(error);
        }
    };

    const actions = document.createElement("div");
    actions.className = "qr-actions";

    const download = document.createElement("a");
    download.href = path;
    download.download = name.replaceAll(" ", "") + "-QR-PSF.png";
    download.textContent = "⬇️ Download QR Code";

    const share = document.createElement("button");
    share.type = "button";
    share.textContent = "📤 Share QR Code";
    share.addEventListener("click", () => shareQR(path, name));

    actions.append(download, share);
    item.append(heading, image, actions);
    qrList.appendChild(item);
});

async function shareQR(path, name) {
    try {
        const response = await fetch(path);
        if (!response.ok) throw new Error("QR image not found");

        const blob = await response.blob();
        const file = new File(
            [blob],
            name.replaceAll(" ", "") + "-QR-PSF.png",
            { type: blob.type || "image/png" }
        );

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
                title: name + " QR Code",
                files: [file]
            });
        } else if (navigator.share) {
            await navigator.share({
                title: name + " QR Code",
                url: new URL(path, location.href).href
            });
        } else {
            window.open(path, "_blank");
        }
    } catch (error) {
        if (error.name !== "AbortError") {
            alert("QR share nahi hua. Pehle Download QR Code try karein.");
        }
    }
}
</script>

</body>
</html>
