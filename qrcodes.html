
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSF Smart QR Guide</title>
<link rel="stylesheet" href="style.css">

<style>
.qr-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 22px;
    padding: 20px;
}
.qr-item {
    background: white;
    padding: 20px;
    border-radius: 22px;
    box-shadow: 0 5px 18px #00000015;
    text-align: center;
    min-width: 0;
}
.qr-item h3 {
    color: #333;
    margin-bottom: 20px;
}
.qr-image {
    display: block;
    width: 180px;
    height: 180px;
    object-fit: contain;
    margin: 0 auto 20px;
}
.qr-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
}
.qr-actions a {
    color: #16864b;
    font-weight: bold;
    text-decoration: none;
    padding: 8px 0;
}
.qr-error {
    color: #c62828;
    font-size: 14px;
}
</style>
</head>

<body>

<header class="header">
    <h1>📱 Smart QR Guide</h1>
    <p>Scan any fruit QR Code to know its health benefits.</p>
</header>

<div class="qr-list" id="qrList"></div>

<div class="home-area">
    <a href="index.html" class="home-btn">🏠 Back to Home</a>
</div>

<script>
const fruits = [
    ["🍎 Apple", "apple.html.png"],
    ["🟣 Anjir", "Anjir.html.png"],
    ["🥑 Avocado", "avocado.html.png"],
    ["🍌 Banana", "banana.html.png"],
    ["Blackberry", "blackberry.html.png"],
    ["🍇 Black Grapes", "blackgrapes.html.png"],
    ["🫐 Blueberry", "blueberry.html.png"],
    ["🍒 Cherry", "cherry.html.png"],
    ["Chiku", "chiku.html.png"],
    ["Custard Apple", "custardapple.html.png"],
    ["Dragon Fruit", "dragonfruit.html.png"],
    ["🍇 Grapes", "grapes.html.png"],
    ["🍏 Green Apple", "greenapple.html.png"],
    ["🍐 Guava", "guava.html.png"],
    ["🥝 Kiwi", "kiwi.html.png"],
    ["🥭 Mango", "mango.html.png"],
    ["🍈 Muskmelon", "muskmelon.html.png"],
    ["🫒 Olive", "olive.html.png"],
    ["🍊 Orange", "orange.html.png"],
    ["Papaya", "papaya.html.png"],
    ["🍑 Peach", "peach.html.png"],
    ["🍐 Pear", "pear.html.png"],
    ["🍍 Pineapple", "pineapple.html.png"],
    ["Pomegranate", "pomegranate.html.png"],
    ["🍓 Strawberry", "strawberry.html.png"],
    ["🍋 Sweet Lime", "sweetlime.html.png"],
    ["🍉 Watermelon", "watermelon.html.png"]
];

const qrList = document.getElementById("qrList");

fruits.forEach(([name, filename]) => {
    const path = "qr/" + filename;

    const card = document.createElement("div");
    card.className = "qr-item";

    const heading = document.createElement("h3");
    heading.textContent = name;

    const image = document.createElement("img");
    image.src = path;
    image.alt = name + " QR Code";
    image.className = "qr-image";

    const error = document.createElement("p");
    error.className = "qr-error";
    error.hidden = true;
    error.textContent = "QR image not found: " + filename;

    image.onerror = () => {
        error.hidden = false;
        image.hidden = true;
    };

    const actions = document.createElement("div");
    actions.className = "qr-actions";

    const download = document.createElement("a");
    download.href = path;
    download.download = name.replace(/[^\w-]/g, "") + "-QR-PSF.png";
    download.textContent = "⬇️ Download QR Code";

    const share = document.createElement("a");
    share.href = path;
    share.textContent = "📤 Share QR Code";

    share.addEventListener("click", async (event) => {
        event.preventDefault();

        const url = new URL(path, document.baseURI).href;

        try {
            if (navigator.share) {
                await navigator.share({
                    title: name + " QR Code",
                    url: url
                });
            } else if (navigator.clipboard) {
                await navigator.clipboard.writeText(url);
                alert("QR image link copied. Share it with others!");
            } else {
                window.open(url, "_blank");
            }
        } catch (err) {
            if (err.name !== "AbortError") {
                window.open(url, "_blank");
            }
        }
    });

    actions.append(download, share);
    card.append(heading, image, error, actions);
    qrList.appendChild(card);
});
</script>

</body>
</html>
