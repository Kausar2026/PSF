
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSF Smart QR Guide</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #edf7ef;
    color: #333;
}

.header {
    background: #159f4b;
    color: white;
    text-align: center;
    padding: 22px 14px 18px;
}

.header h1 {
    font-size: clamp(30px, 7vw, 48px);
    margin: 0 0 8px;
}

.header p {
    font-size: clamp(17px, 4vw, 23px);
    margin: 0;
    line-height: 1.4;
}

/* QR list */
.qr-list {
    width: min(92%, 760px);
    margin: 20px auto;
}

/* Same design, less card height */
.qr-item {
    background: white;
    border-radius: 28px;
    padding: 18px 16px;
    margin-bottom: 18px;
    text-align: center;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.08);
}

.qr-item h3 {
    font-size: 22px;
    margin: 0 0 14px;
}

/* QR size preserved */
.qr-image {
    display: block;
    width: 170px;
    height: 170px;
    max-width: 90%;
    object-fit: contain;
    margin: 0 auto 14px;
    background: white;
}

.qr-error {
    display: none;
    color: #c62828;
    font-size: 14px;
    margin: 8px 0 12px;
    overflow-wrap: anywhere;
}

.qr-actions {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px 20px;
}

.qr-actions button {
    border: none;
    background: transparent;
    color: #218653;
    font-size: 15px;
    font-weight: bold;
    padding: 6px 0;
    cursor: pointer;
    font-family: inherit;
}

.qr-actions button:active {
    opacity: 0.6;
}

.status {
    font-size: 13px;
    color: #555;
    margin-top: 0;
    overflow-wrap: anywhere;
}

.status:not(:empty) {
    margin-top: 8px;
}

.home-area {
    text-align: center;
    padding: 4px 15px 25px;
}

.home-btn {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 12px;
    background: #159f4b;
    color: white;
    text-decoration: none;
    font-weight: bold;
}

/* Mobile design */
@media (max-width: 480px) {
    .header {
        padding: 20px 12px 16px;
    }

    .qr-list {
        width: 92%;
        margin: 16px auto;
    }

    .qr-item {
        border-radius: 24px;
        padding: 16px 12px;
        margin-bottom: 16px;
    }

    .qr-item h3 {
        font-size: 23px;
        margin-bottom: 12px;
    }

    .qr-image {
        width: 170px;
        height: 170px;
        max-width: 90%;
        margin-bottom: 12px;
    }

    .qr-actions {
        gap: 6px 14px;
    }

    .qr-actions button {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>📱 Smart QR Guide</h1>
    <p>Scan any fruit QR Code to know its health benefits.</p>
</header>

<main class="qr-list" id="qrList"></main>

<div class="home-area">
    <a href="index.html" class="home-btn">
        🏠 Back to Home
    </a>
</div>

<script>
const fruits = [
    ["Apple", "🍎", "apple.html.png"],
    ["Anjir", "🟣", "anjir.html.png"],
    ["Avocado", "🥑", "avocado.html.png"],
    ["Banana", "🍌", "banana.html.png"],
    ["Blackberry", "🫐", "blackberry.html.png"],
    ["Black Grapes", "🍇", "blackgrapes.html.png"],
    ["Blueberry", "🫐", "blueberry.html.png"],
    ["Cherry", "🍒", "cherry.html.png"],
    ["Chiku", "🥔", "chiku.html.png"],
    ["Custard Apple", "🍈", "custardapple.html.png"],
    ["Dragon Fruit", "🐉", "dragonfruit.html.png"],
    ["Grapes", "🍇", "grapes.html.png"],
    ["Green Apple", "🍏", "greenapple.html.png"],
    ["Guava", "🍐", "guava.html.png"],
    ["Kiwi", "🥝", "kiwi.html.png"],
    ["Mango", "🥭", "mango.html.png"],
    ["Muskmelon", "🍈", "muskmelon.html.png"],
    ["Olive", "🫒", "olive.html.png"],
    ["Orange", "🍊", "orange.html.png"],
    ["Papaya", "🧡", "papaya.html.png"],
    ["Peach", "🍑", "peach.html.png"],
    ["Pear", "🍐", "pear.html.png"],
    ["Pineapple", "🍍", "pineapple.html.png"],
    ["Pomegranate", "❤️", "pomegranate.html.png"],
    ["Strawberry", "🍓", "strawberry.html.png"],
    ["Sweet Lime", "🍋", "sweetlime.html.png"],
    ["Watermelon", "🍉", "watermelon.html.png"]
];

const qrList = document.getElementById("qrList");

fruits.forEach(([name, emoji, file]) => {
    const card = document.createElement("section");
    card.className = "qr-item";

    const heading = document.createElement("h3");
    heading.textContent = `${emoji} ${name}`;

    const image = document.createElement("img");
    image.className = "qr-image";
    image.alt = `${name} QR Code`;
    image.src = file;

    const error = document.createElement("p");
    error.className = "qr-error";
    error.textContent = `QR image not found: ${file}`;

    image.addEventListener("error", () => {
        image.style.display = "none";
        error.style.display = "block";
    });

    image.addEventListener("load", () => {
        image.style.display = "block";
        error.style.display = "none";
    });

    const actions = document.createElement("div");
    actions.className = "qr-actions";

    const download = document.createElement("button");
    download.type = "button";
    download.textContent = "⬇️ Download QR Code";

    download.addEventListener("click", () => {
        downloadQR(file, name);
    });

    const share = document.createElement("button");
    share.type = "button";
    share.textContent = "📤 Share QR Code";

    share.addEventListener("click", () => {
        shareQR(file, name);
    });

    const status = document.createElement("div");
    status.className = "status";
    status.setAttribute("aria-live", "polite");

    actions.append(download, share);
    card.append(heading, image, error, actions, status);
    qrList.appendChild(card);
});

async function downloadQR(path, name) {
    const card = findCard(name);
    const status = card.querySelector(".status");

    try {
        const response = await fetch(path);

        if (!response.ok) {
            throw new Error("QR image file nahi mili.");
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download =
            name.replace(/\s+/g, "-") + "-QR-PSF.png";

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 2000);

        status.textContent =
            "Download start ho gaya. Downloads folder check karo.";

    } catch (err) {
        status.textContent =
            "Download fail hua. Filename aur image path check karo.";

        console.error(err);
    }
}

async function shareQR(path, name) {
    const card = findCard(name);
    const status = card.querySelector(".status");

    try {
        const response = await fetch(path);

        if (!response.ok) {
            throw new Error("QR image file nahi mili.");
        }

        const blob = await response.blob();

        const file = new File(
            [blob],
            name.replace(/\s+/g, "-") + "-QR-PSF.png",
            { type: blob.type || "image/png" }
        );

        if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({ files: [file] })
        ) {
            await navigator.share({
                title: name + " QR Code",
                files: [file]
            });

            status.textContent = "Share menu open ho gaya.";

        } else if (navigator.share) {
            await navigator.share({
                title: name + " QR Code",
                url: new URL(path, location.href).href
            });

            status.textContent = "Share menu open ho gaya.";

        } else {
            await navigator.clipboard.writeText(
                new URL(path, location.href).href
            );

            status.textContent =
                "QR link copy ho gaya. Ab share kar sakte ho.";
        }

    } catch (err) {
        if (err.name !== "AbortError") {
            status.textContent =
                "Share nahi hua. Filename aur image path check karo.";

            console.error(err);
        }
    }
}

function findCard(name) {
    return [...document.querySelectorAll(".qr-item")]
        .find(card =>
            card.querySelector("h3").textContent.includes(name)
        );
}
</script>

</body>
</html>
