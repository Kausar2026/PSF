
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087d48">

  <title>PSF AI Fruit Assistant</title>

  <link rel="stylesheet" href="./ai.css">
  <script src="./ai.js" defer></script>
</head>

<body>
  <main class="app">

    <!-- HEADER -->
    <header class="header">
      <button type="button"
              class="icon-btn menu-btn"
              id="menuButton"
              aria-label="Open menu">
        ☰
      </button>

      <div class="brand">
        <div class="brand-icon">🍎</div>
        <div class="brand-title">PSF AI  Assistant</div>
        <div class="brand-subtitle">
          Freshness You Can Trust
        </div>
      </div>

      <button type="button"
              class="icon-btn home-btn"
              id="homeButton"
              aria-label="Home">
        <svg viewBox="0 0 24 24"
             width="27" height="27"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round"
             aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5"/>
          <path d="M5.5 9.5V21h13V9.5"/>
          <path d="M9 21v-7h6v7"/>
        </svg>
      </button>
    </header>

    <!-- MENU OVERLAY -->
    <div class="drawer-overlay"
         id="drawerOverlay"
         hidden>
    </div>

    <!-- SIDE MENU -->
    <aside class="side-drawer"
           id="sideDrawer"
           aria-label="Main menu"
           aria-hidden="true">

      <button type="button"
              class="drawer-close"
              id="drawerClose"
              aria-label="Close menu">
        ×
      </button>

      <div class="drawer-brand">
        <div class="drawer-logo">🍎</div>
        <strong>PSF AI Fruit Assistant</strong>
        <small>Freshness You Can Trust</small>
      </div>

      <!-- MENU OPTIONS -->
      <nav class="drawer-nav">

        <button type="button" data-page="newchat">
          <span class="nav-icon">＋</span>
          <span>New Chat</span>
        </button>

        <button type="button" data-page="history">
          <span class="nav-icon">◷</span>
          <span data-i18n="history">Chat History</span>
        </button>

        <button type="button" data-page="settings">
          <span class="nav-icon">⚙</span>
          <span data-i18n="settings">Settings</span>
        </button>

        <button type="button" data-page="language">
          <span class="nav-icon">文</span>
          <span data-i18n="language">Language</span>
        </button>

      </nav>

      <!-- SETTINGS -->
      <section class="drawer-section"
               id="drawerSettings"
               hidden>
        <h3 data-i18n="settings">Settings</h3>

        <label for="languageSelect"
               data-i18n="chooseLanguage">
          Choose your language
        </label>

        <select id="languageSelect">
          <option value="hi">हिन्दी (Hindi)</option>
          <option value="en">English</option>
        </select>
      </section>

      <!-- CHAT HISTORY -->
      <section class="drawer-section"
               id="drawerHistory"
               hidden>
        <h3 data-i18n="history">Chat History</h3>

        <button type="button"
                id="clearHistory"
                class="clear-history">
          Clear all chats
        </button>

        <div id="historyList"></div>
      </section>

      <!-- MENU FOOTER -->
      <div class="drawer-footer">
        <div class="footer-fruits">🍌 🍎 🥭 🍇</div>
        <strong>PSF Fruit Assistant</strong>
        <small>Freshness You Can Trust</small>
      </div>

    </aside>

    <!-- CHAT AREA: ONLY ONE -->
    <section class="chat-area"
             id="chatArea"
             aria-live="polite">

      <!-- WELCOME SCREEN -->
      <div class="welcome" id="welcome">

        <div class="welcome-art">

          <!-- VOICE ORB -->
        <div class="voice-orb">
  <span class="orb-label">PSF</span>
  </div>
          <!-- INDIAN FLAG / ASHOKA CHAKRA -->
          <div class="india-badge">

            <svg class="ashoka-chakra"
                 viewBox="0 0 48 48"
                 xmlns="http://www.w3.org/2000/svg"
                 role="img"
                 aria-label="24-spoke Ashoka Chakra">

              <circle cx="24" cy="24" r="10"
                      fill="none"
                      stroke="#174B91"
                      stroke-width="1.5"/>

              <g stroke="#174B91"
                 stroke-width="1.15"
                 stroke-linecap="round">

                <path d="M24 14V34"/>
                <path d="M24 14V34" transform="rotate(15 24 24)"/>
                <path d="M24 14V34" transform="rotate(30 24 24)"/>
                <path d="M24 14V34" transform="rotate(45 24 24)"/>
                <path d="M24 14V34" transform="rotate(60 24 24)"/>
                <path d="M24 14V34" transform="rotate(75 24 24)"/>
                <path d="M24 14V34" transform="rotate(90 24 24)"/>
                <path d="M24 14V34" transform="rotate(105 24 24)"/>
                <path d="M24 14V34" transform="rotate(120 24 24)"/>
                <path d="M24 14V34" transform="rotate(135 24 24)"/>
                <path d="M24 14V34" transform="rotate(150 24 24)"/>
                <path d="M24 14V34" transform="rotate(165 24 24)"/>
                <path d="M24 14V34" transform="rotate(180 24 24)"/>
                <path d="M24 14V34" transform="rotate(195 24 24)"/>
                <path d="M24 14V34" transform="rotate(210 24 24)"/>
                <path d="M24 14V34" transform="rotate(225 24 24)"/>
                <path d="M24 14V34" transform="rotate(240 24 24)"/>
                <path d="M24 14V34" transform="rotate(255 24 24)"/>
                <path d="M24 14V34" transform="rotate(270 24 24)"/>
                <path d="M24 14V34" transform="rotate(285 24 24)"/>
                <path d="M24 14V34" transform="rotate(300 24 24)"/>
                <path d="M24 14V34" transform="rotate(315 24 24)"/>
                <path d="M24 14V34" transform="rotate(330 24 24)"/>
                <path d="M24 14V34" transform="rotate(345 24 24)"/>

              </g>

              <circle cx="24" cy="24" r="2"
                      fill="#174B91"/>
            </svg>

          </div>
        </div>

      </div>

      <!-- CHAT MESSAGES: OUTSIDE WELCOME -->
      <div id="messages"></div>

    </section>

    <!-- BOTTOM INPUT -->
    <footer class="input-area">

      <form class="input-box" id="chatForm">

        <textarea
          id="question"
          name="message"
          rows="1"
          maxlength="1000"
          placeholder="Phalon ke baare mein poochhein..."
          aria-label="Type your question"></textarea>

        <button type="button"
                id="actionButton"
                aria-label="Voice input"
                title="Voice input">

          <!-- MIC -->
          <svg id="micIcon"
               viewBox="0 0 24 24"
               width="25"
               height="25"
               fill="none"
               stroke="currentColor"
               stroke-width="2"
               stroke-linecap="round"
               stroke-linejoin="round"
               aria-hidden="true">

            <rect x="9" y="2"
                  width="6" height="13"
                  rx="3"/>

            <path d="M5 10v2a7 7 0 0 0 14 0v-2"/>
            <path d="M12 19v3M9 22h6"/>

          </svg>

          <!-- SEND -->
          <span id="sendIcon"
                hidden
                aria-hidden="true">➤</span>

        </button>

      </form>
    </footer>

  </main>
</body>
</html>
